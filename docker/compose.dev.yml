# Stack di sviluppo COMPLETO di BiblioStack (PostgreSQL + Redis + backend + frontend).
# Non richiede Node/npm/PostgreSQL sull'host: serve solo Docker.
#
# Uso consigliato tramite lo script nella root del repository:
#   ./bibliostack.sh up      (avvia tutto)
#   ./bibliostack.sh seed    (carica i dati di esempio)
#   ./bibliostack.sh help    (elenco comandi)
#
# Tutti i valori hanno default pensati SOLO per lo sviluppo locale.
# Per sovrascriverli: cp docker/.env.dev.example docker/.env.dev e modificare.

name: bibliostack-dev

x-db-env: &db-env
  POSTGRES_USER: ${POSTGRES_USER:-bibliostack}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bibliostack_dev}
  POSTGRES_DB: ${POSTGRES_DB:-bibliostack}

services:
  # ---------- DATABASE ----------
  db:
    build: ./postgres            # postgres:18.3 + locale it_IT.UTF-8
    environment:
      <<: *db-env
    command: ["postgres", "-c", "timezone=Europe/Rome"]
    ports:
      # Esposto solo su localhost, utile per collegarsi con DataGrip/DBeaver
      - "127.0.0.1:${DB_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h 127.0.0.1: durante l'esecuzione degli script di init Postgres ascolta solo sul socket,
      # così il servizio risulta "healthy" solo a init completato
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # ---------- REDIS ----------
  redis:
    image: redis:${REDIS_VERSION:-8.10.2-alpine}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-redis_dev}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:-redis_dev}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ---------- BACKEND (Express) ----------
  backend:
    build:
      context: ../backend
      target: dev
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 5001
      FRONTEND_URL: http://localhost:${FRONTEND_HOST_PORT:-5173}
      DATABASE_URL: postgresql://${POSTGRES_USER:-bibliostack}:${POSTGRES_PASSWORD:-bibliostack_dev}@db:5432/${POSTGRES_DB:-bibliostack}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_dev}
      JWT_SECRET: ${JWT_SECRET:-dev-only-access-secret-change-me}
      JWT_REFRESH: ${JWT_REFRESH:-dev-only-refresh-secret-change-me}
      CARD_SECRET: ${CARD_SECRET:-dev-only-card-secret-change-me}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      TRUST_PROXY_HOPS: 0
      # Integrazioni opzionali: lasciate vuote le relative funzioni restano disattivate
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      ALLOWED_GOOGLE_DOMAINS: ${ALLOWED_GOOGLE_DOMAINS:-example.invalid}
      ALLOW_PUBLIC_REGISTRATION: ${ALLOW_PUBLIC_REGISTRATION:-false}
    ports:
      - "${BACKEND_HOST_PORT:-5001}:5001"
    volumes:
      - ../backend:/app
      # node_modules resta quello compilato nell'immagine (argon2 è un modulo nativo Linux)
      - /app/node_modules

  # ---------- FRONTEND (Vite) ----------
  frontend:
    build:
      context: ../frontend
      target: dev
    depends_on:
      - backend
    environment:
      # Questi URL vengono usati dal BROWSER, quindi puntano alle porte pubblicate sull'host
      VITE_API_URL: http://localhost:${BACKEND_HOST_PORT:-5001}/api
      VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:5173"
    volumes:
      - ../frontend:/app
      - /app/node_modules

volumes:
  pgdata:
